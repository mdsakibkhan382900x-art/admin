<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAKIB X ADMIN</title><style>
:root{color-scheme:dark;--bg:#05060a;--card:#11131d;--card2:#181b27;--text:#f7f8ff;--muted:#9ba1b5;--line:#292e42;--a:#7c5cff;--danger:#ff5577;--good:#27d17f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--text)}main{min-height:100vh;padding:20px 14px 50px;background:radial-gradient(circle at 50% -10%,#24195b 0,#0b0c14 35%,var(--bg) 70%)}.wrap{max-width:1000px;margin:auto}.brand{font-weight:900;letter-spacing:.6px}.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;padding:18px}.login{max-width:430px;margin:70px auto}.field{width:100%;padding:13px 14px;background:#0d0f17;border:1px solid var(--line);border-radius:12px;color:#fff;outline:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(135deg,var(--a),#4d8dff);color:#fff;font-weight:800;cursor:pointer}.alt{background:#ffffff0b;border:1px solid var(--line)}.danger{background:linear-gradient(135deg,#ff426d,#c92e54)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:8px;margin-top:14px}.row{display:grid;grid-template-columns:1.2fr .8fr 1.6fr auto;gap:8px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:#ffffff05}.muted{color:var(--muted);font-size:12px}.ok{color:var(--good)}.err{color:var(--danger)}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.row .btn{width:100%}}
</style></head><body><main><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div class="brand">SAKIB X ADMIN</div><button id="logout" class="btn alt" style="display:none">LOGOUT</button></div><div id="login" class="panel login"><h2>SAKIB X ADMIN</h2><p class="muted">Admin access only.</p><input id="email" class="field" type="email" placeholder="Admin email"><br><br><input id="password" class="field" type="password" placeholder="Password"><div class="actions"><button id="loginBtn" class="btn">LOGIN</button></div><p id="status" class="muted"></p></div><div id="dash" style="display:none"><div class="panel"><h3>Add / Edit Download</h3><div class="grid"><input id="name" class="field" placeholder="File name"><input id="type" class="field" placeholder="Type"><input id="url" class="field" placeholder="Authorized download URL"><input id="setupUrl" class="field" placeholder="How To Set Up URL"><input id="version" class="field" placeholder="Version / size"><select id="usage" class="field"><option value="used">Used</option><option value="do-not-used">Do Not Used</option></select></div><div class="actions"><button id="save" class="btn">SAVE FILE</button><button id="clear" class="btn alt">CLEAR</button></div><p id="saveStatus" class="muted"></p></div><div class="panel" style="margin-top:12px"><h3>Downloads</h3><div id="items" class="list"></div></div></div></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getDatabase,ref,onValue,push,set,remove}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';const config={apiKey:'AIzaSyAO2EFvX_6v0mHeFGu2n6i23KD1YQKwZNQ',authDomain:'dawnlod-d3d5b.firebaseapp.com',projectId:'dawnlod-d3d5b',databaseURL:'https://dawnlod-d3d5b-default-rtdb.asia-southeast1.firebasedatabase.app',storageBucket:'dawnlod-d3d5b.firebasestorage.app',messagingSenderId:'898464579807',appId:'1:898464579807:web:4da7d3abc539026039696a'};const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);let editing=null,data={};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}onAuthStateChanged(auth,u=>{const ok=!!u;$('login').style.display=ok?'none':'block';$('dash').style.display=ok?'block':'none';$('logout').style.display=ok?'block':'none';if(ok)watch()});$('loginBtn').onclick=()=>signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value).catch(e=>$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>');$('logout').onclick=()=>signOut(auth);function watch(){onValue(ref(db,'downloads'),s=>{data=s.val()||{};render()})}function render(){$('items').innerHTML=Object.entries(data).map(([k,v])=>`<div class="row"><div><b>${esc(v.name)}</b><div class="muted">${esc(v.type)}</div></div><div class="muted">${esc(v.version)}</div><div class="muted">${esc(v.url)}<br><span class="muted">Setup: ${esc(v.setupUrl||'Not set')}</span><br><span class="${v.usage==='used'?'ok':'err'}">${v.usage==='used'?'USED':'DO NOT USED'}</span></div><div class="actions"><button class="btn alt" data-edit="${k}">EDIT</button><button class="btn danger" data-del="${k}">DELETE</button></div></div>`).join('')||'<div class="muted">No downloads yet.</div>';$('items').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('items').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this file?'))remove(ref(db,'downloads/'+b.dataset.del))})}function edit(k){editing=k;let v=data[k]||{};$('name').value=v.name||'';$('type').value=v.type||'';$('url').value=v.url||'';$('setupUrl').value=v.setupUrl||'';$('version').value=v.version||'';$('usage').value=v.usage||'used';scrollTo({top:0,behavior:'smooth'})}$('save').onclick=()=>{let v={name:$('name').value.trim(),type:$('type').value.trim()||'File',url:$('url').value.trim(),setupUrl:$('setupUrl').value.trim(),version:$('version').value.trim(),usage:$('usage').value};if(!v.name){$('saveStatus').innerHTML='<span class="err">Enter a file name.</span>';return}let r=editing?ref(db,'downloads/'+editing):push(ref(db,'downloads'));set(r,v).then(()=>{$('saveStatus').innerHTML='<span class="ok">Saved.</span>';clear()}).catch(e=>$('saveStatus').innerHTML='<span class="err">'+esc(e.message)+'</span>')};function clear(){editing=null;$('name').value='';$('type').value='';$('url').value='';$('setupUrl').value='';$('version').value='';$('usage').value='used'}$('clear').onclick=clear;
</script></body></html>
